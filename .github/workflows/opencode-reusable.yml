name: opencode (reusable)

# Reusable workflow callers can invoke with:
#   uses: cineconcertsapp/.github/.github/workflows/opencode-reusable.yml@main
#   secrets:
#     OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

on:
  workflow_call:
    inputs:
      model:
        description: "Model identifier passed to opencode (default: Claude Opus 4.7)"
        required: false
        type: string
        default: opencode/claude-opus-4-7
    secrets:
      OPENCODE_API_KEY:
        required: true

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ inputs.model }}
